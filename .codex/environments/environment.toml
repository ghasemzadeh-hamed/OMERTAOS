[[actions]]
name = "Switch CAPO (manual)"
icon = "tool"
command = '''
git fetch origin

if (git show-ref --verify --quiet refs/heads/capo) {
    git switch capo
} elseif (git ls-remote --exit-code --heads origin capo) {
    git switch -c capo --track origin/capo
} else {
    git switch -c capo
}

git branch --show-current'''

