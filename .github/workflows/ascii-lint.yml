name: ASCII Lint

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  ascii:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ASCII sanitizer if exists
        run: |
          if [ -f tools/sanitize_ascii.py ]; then
            python tools/sanitize_ascii.py
          else
            echo "No ASCII sanitizer found, skipping."
          fim
