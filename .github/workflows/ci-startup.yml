name: Startup Product CI

on:
  push:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t omertaos:ci .

      - name: Basic Security Scan
        run: |
          docker run --rm aquasec/trivy image omertaos:ci || true
