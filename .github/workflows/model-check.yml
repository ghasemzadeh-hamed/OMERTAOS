name: model-check

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (if exists)
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found"
          fi

      - name: Train & evaluate (CI mode)
        run: |
          if [ -f scripts/train_eval.py ]; then
            python scripts/train_eval.py --config policies/training.yaml --ci
          else
            echo "Training script not found, skipping"
          fi

      - name: Guard generalization
        run: |
          if [ -f scripts/guard_generalization.py ]; then
            python scripts/guard_generalization.py
          else
            echo "Generalization guard not found, skipping"
          fi

      - name: Static analysis (Semgrep)
        run: |
          python -m pip install semgrep
          semgrep --config auto || true

      - name: Generate SBOM (CycloneDX)
        run: |
          python -m pip install cyclonedx-bom
          if [ -f requirements.txt ]; then
            cyclonedx-py requirements requirements.txt -o sbom.json -F json
          else
            echo "No requirements.txt for SBOM"
          fi
