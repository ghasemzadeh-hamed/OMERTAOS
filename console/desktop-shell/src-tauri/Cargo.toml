[package]
name = "omertaos-desktop"
version = "0.1.0"
description = "Optional native desktop shell for OMERTAOS"
authors = ["OMERTAOS Contributors"]
edition = "2021"

[lib]
name = "omertaos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
