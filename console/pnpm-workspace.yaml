  defu: ^6.1.5
  dompurify: ^3.4.13
  effect: ^3.20.0
  flatted: ^3.4.2
  form-data: ^4.0.6
  glob@>=10.2.0 <10.5.0: ^10.5.0
  js-yaml: ^4.3.1
  minimatch: ^3.1.3
  minimatch@9: ^9.0.7
  picomatch@<2.3.2: 2.3.2
  picomatch@>=4.0.0 <4.0.4: ^4.0.5
  preact: ^10.27.3
  postcss: ^8.5.26
