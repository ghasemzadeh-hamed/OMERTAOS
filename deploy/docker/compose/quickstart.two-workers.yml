services:
  runtime-secondary:
    image: ${AION_RUNTIME_IMAGE:-omertaos-runtime}
    environment:
      AION_RUNTIME_BIND_ADDR: 0.0.0.0:50051
      AION_RUNTIME_NODE_ID: runtime-quickstart-2
      AION_RUNTIME_CAPABILITIES: terminal.execute,resource.allocate
      AION_RUNTIME_MEMORY_MB: "1024"
      OMERTA_PROFILE: ${OMERTA_PROFILE:-lite}
      RUST_LOG: ${RUST_LOG:-info}
    ports: []
    healthcheck:
      test: ["CMD", "/usr/local/bin/runtime-daemon", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  control:
    environment:
      AION_RUNTIME_MANAGED_NODE_LIMIT: "2"
      AION_RUNTIME_NODES_JSON: >-
        [{"node_id":"runtime-quickstart-1","endpoint":"runtime:50051","capabilities":["terminal.execute"],"tenant_ids":["tenant-shared","tenant-primary"],"total_cpu_millis":1000,"total_memory_mb":512},{"node_id":"runtime-quickstart-2","endpoint":"runtime-secondary:50051","capabilities":["terminal.execute","resource.allocate"],"tenant_ids":["tenant-shared","tenant-secondary"],"total_cpu_millis":2000,"total_memory_mb":1024}]
